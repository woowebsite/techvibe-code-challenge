name: CI Pipeline

on:
  push:
    branches: [main, master, develop, problem*]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Problem 1 (Independent)
      - name: Run Problem 1 Unit Tests
        working-directory: src/problem1
        run: npm test

      # Problem 2 (Independent)
      - name: Install Problem 2 Dependencies
        working-directory: src/problem2
        run: npm install --legacy-peer-deps

      - name: Run Problem 2 Unit Tests & Coverage
        working-directory: src/problem2
        run: npm run test:coverage

      - name: Build Problem 2 Production Bundle
        working-directory: src/problem2
        run: npm run build
